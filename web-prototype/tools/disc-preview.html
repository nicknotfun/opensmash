<!doctype html>
<html><head><meta charset="utf-8"><title>Melee hardware preview</title><style>
body{margin:0;background:#141217;color:#eee;font:16px system-ui}canvas{display:block;width:100%;height:85vh}label{display:flex;gap:20px;justify-content:center;padding:20px}input{width:50%}
</style></head><body><canvas></canvas><label>Insertion <input aria-label="Insertion" type="range" min="0" max="100" value="0"></label>
<script type="module">
import * as THREE from 'three';
import {createDisc,createGameCube} from '../../engines/melee/launcher/disc-hardware.js';
import labelUrl from '../visual/assets/cartridge-label-art.webp?url';
const renderer=new THREE.WebGLRenderer({canvas:document.querySelector('canvas'),antialias:true});
renderer.setSize(innerWidth,innerHeight*.85);renderer.setPixelRatio(devicePixelRatio);renderer.setClearColor(0x141217);renderer.outputColorSpace=THREE.SRGBColorSpace;
const scene=new THREE.Scene(),camera=new THREE.PerspectiveCamera(35,innerWidth/(innerHeight*.85),.01,100);camera.position.set(2.3,1.7,2.3);camera.lookAt(0,.05,0);
scene.add(new THREE.HemisphereLight(0xffeddb,0x30304a,2));const key=new THREE.DirectionalLight(0xffffff,3);key.position.set(2,4,3);scene.add(key);
const cube=createGameCube(),disc=createDisc(await new THREE.TextureLoader().loadAsync(labelUrl));scene.add(cube,disc);
disc.scale.setScalar(.44);disc.rotation.z=Math.PI/2;
function draw(){const t=document.querySelector('input').value/100;disc.position.copy(cube.userData.mouthAnchor).lerp(cube.userData.snapAnchor,Math.min(1,t/.7));cube.userData.lid.rotation.z=1.32*(1-Math.max(0,(t-.7)/.3));renderer.render(scene,camera);}
document.querySelector('input').addEventListener('input',draw);draw();
</script></body></html>
