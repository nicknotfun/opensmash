name: Multiplayer checks
on:
  pull_request:
  push:
    branches: [main, codex/webtransport-multiplayer]

permissions:
  contents: read

jobs:
  browser-and-gates:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm install --global pnpm@11.5.0
      - run: pnpm install --frozen-lockfile --ignore-scripts
        working-directory: web-prototype
      - run: npm ci --ignore-scripts
        working-directory: engines/melee/web
      - run: pnpm test && pnpm build
        working-directory: web-prototype
      - name: Deployment configuration and gateway checks
        run: |
          node --test deploy/cloudflare/*.test.mjs deploy/gcp/*.test.mjs web-prototype/infra/pilot-site.test.mjs engines/melee/tests/server.test.mjs
          python3 -m unittest discover -s deploy/gcp -p "*_test.py"
      - run: npx tsc --noEmit
        working-directory: engines/melee/web
      - run: node --test engines/melee/tests/netplay*.test.mjs engines/melee/tests/presentation.test.mjs engines/melee/tests/launch_options.test.mjs engines/melee/tests/launcher_selection.test.mjs engines/melee/tests/controller_profiles.test.mjs
      - run: |
          g++ -std=c++20 -pthread -Wall -Wextra -Werror engines/melee/tests/netplay_gate.cpp -o /tmp/melee-netplay-gate
          /tmp/melee-netplay-gate
          python3 -m unittest discover -s engines/ssb64/netplay -p 'test_*.py'
  relay:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Configure Go caches
        run: |
          echo "GOMODCACHE=$RUNNER_TEMP/netplay-go-mod" >> "$GITHUB_ENV"
          echo "GOCACHE=$RUNNER_TEMP/netplay-go-build" >> "$GITHUB_ENV"
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.0'
          cache-dependency-path: netplay/relay/go.sum
      - run: go test -race ./...
        working-directory: netplay/relay
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: netplay/tests/package-lock.json
      - run: npm ci
        working-directory: netplay/tests
      - run: npx playwright install --with-deps chromium
        working-directory: netplay/tests
      - name: Four-browser WebTransport input synchronization
        run: npm test
        working-directory: netplay/tests
